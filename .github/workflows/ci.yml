name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Verify
        run: mvn -B verify
