name: Publish

on:
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Verify
        run: mvn -B verify

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Writes ~/.m2/settings.xml with an `ossrh` server entry (the id the
      # central-distro profile publishes with) and a `gpg.passphrase` entry,
      # both read from the env vars named here, and imports the GPG key.
      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Deploy library to Maven Central
        # Only the library module is deployed: the aggregator and the example
        # app set maven.deploy.skip. The central-distro profile adds the
        # sources/javadoc jars, GPG signatures and the Central Portal upload.
        run: mvn -B -pl library -am deploy -DskipTests -Pcentral-distro
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}

      - name: Tag release
        run: |
          git config user.name "GitHub Action"
          git config user.email noreply@ngrok.com
          version=$(mvn -B -q -pl library help:evaluate -Dexpression=project.version -DforceStdout)
          tag="v$version"
          echo "Tagging release: $tag"
          git fetch --tags
          if git rev-parse "refs/tags/$tag" > /dev/null 2>&1; then
            echo "Tag $tag already exists, skipping tag creation."
          else
            git tag -a -m "Version ${version}" "$tag"
            git push --tags
          fi
